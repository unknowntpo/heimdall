# M1 data sources (Spec 0003, B1). Only datasets listed here are downloaded.
# Revisions are Hub commit shas, looked up with the Hub API on 2026-11-14.
# Licences are as stated on each dataset card at that revision.
#
# Keys: id, revision, license, allowed, use, format (parquet|csv|jsonl), files (upstream split -> path),
# text (column), label + label_map or fixed_label, lang ("detect-en-de" = stop-word heuristic),
# optional sample (deterministic: smallest ids), split_by_hash ([train, val] default, or [train, val, test]),
# translation_of + translation_block + opencc for row-aligned translations (B6).

