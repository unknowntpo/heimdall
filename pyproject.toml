[project]
name = "heimdall"
version = "0.0.1"
description = "Prompt injection / jailbreak guardrail model (walking skeleton)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "huggingface-hub>=0.24",
    "pyarrow>=16",
    "torch>=2.4",
    "transformers>=4.44",
]

[project.scripts]
heimdall = "heimdall.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heimdall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
